name: build and deploy

# when to trigger
on: 
   
	# here i said when push on github repo
  
    push: 
	#which branches to do this action on it
        branches:
            - main
			
jobs:
	# the name of this job
    build-deploy:
        name: build and deploy spring boot CICD
		#tell to run this pipeline on which server 
        runs-on: ubuntu-latest
		#steps to do this job
        steps:
		#first step is to check the code that will run on server we select on (runs-on)
            - name: checkout code
                uses: actions/checkout@v3
			
            - name: setup JDK 17
                uses: actions/setup-java@v3
                with: 
                    distribution: 'corretto'
                    java-version: 17
					
            - name: Uint Tests
			#run use to run single comand
                run: mvn -B test --file pom.xml
			# to run multiple comand use |
            - name: Build the application
                run: |
                    mvn clean
                    mvn -B package --file pom.xml