

<div class="page">

  <!-- Header -->
  <div class="header">
    <button [routerLink]="['']" class="icon-btn">←</button>
    <h1 >{{taskList.title}}</h1>
    <button [routerLink]="['/task-list',taskList.id,'update-task-list']" class="icon-btn">✎</button>
  </div>

  <div class="progress-container">
    <div class="progress-bar" [style.width.%]="progress"></div>
  </div>

  <span>{{ progress }}%</span>

  <!-- Add task -->
  <button [routerLink]="['/task-list', taskList.id, 'new-task']" class="add-task-btn">
    + Add Task
  </button>

  <!-- Tasks Table -->
  <div class="table">

    <div class="table-header">
      <span>Completed</span>
      <span>Title</span>
      <span>Priority</span>
      <span>Due Date</span>
      <span>Actions</span>
    </div>

    <div class="table-row" *ngFor="let task of taskList.tasks">
      <input
        type="checkbox"
        [checked]="task.status === 'CLOSE'"
        (change)="toggleStatus(task)"
      />

      <span [class.closed]="task.status === 'CLOSE'">
  {{ task.title }}
</span>

      <span class="badge high">{{task.priority}}</span>

      <span class="date">{{task.dueDate}}</span>

      <div class="actions">
        <button [routerLink]="['/task-list', taskList.id, 'task',task.id]"  class="icon-btn">✎</button>
        <button (click)="delectTask(task)" class="icon-btn">🗑</button>
      </div>
    </div>

  </div>

  <!-- Delete task list -->
  <button (click)="deleteTask()" class="delete-list-btn">
    − Delete TaskList
  </button>

</div>
